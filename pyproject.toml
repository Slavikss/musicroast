[tool.poetry]
name = "musicroast"
version = "0.2.0"
description = "Сервис прожарки музыкального вкуса: Яндекс Музыка + LLM + Telegram"
authors = ["Vyacheslav Guch <ssslllava11@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
yandex-music = "^3.0"
python-dotenv = "*"
fastapi = ">=0.104.0"
uvicorn = ">=0.24.0"
pydantic = ">=2.4.2"
pillow = "*"
aiogram = ">=3.4.1,<4.0.0"
httpx = ">=0.27.0,<0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
